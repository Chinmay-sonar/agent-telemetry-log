name: Autonomous Spider-Web Sentinel

on:
  schedule:
    - cron: "15 3 * * *" # Daily at 08:45 AM IST (03:15 UTC)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  telemetry-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git Identity
        run: |
          git config user.name "Chinmay Sonar"
          git config user.email "chinmaysonarofficial@gmail.com"

      - name: Run Telemetry & Open-Source Scout Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-pulse.js

      - name: Deliver via Pull Request Flow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deliver-pr.js
